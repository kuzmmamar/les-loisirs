<!doctype html>
<html lang="ru" data-build="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Les Loisirs" />
  <meta name="theme-color" content="#0C0B0E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=73" />
  <title>Les Loisirs</title>
  <script>
    (function () {
      var here = document.documentElement.getAttribute("data-build") || "";
      fetch("/api/app-version", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.build || !here || String(d.build) === here) return;
          if (location.search.indexOf("v=" + d.build) !== -1) return;
          location.replace("/?v=" + encodeURIComponent(d.build));
        })
        .catch(function () {});
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=63" />
</head>
<body>
  <div class="phone-shell">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-title">Les Loisirs</span>
        </div>
        <div class="who-slider-wrap" aria-label="Переключатель профиля А и +1">
          <span class="who-top-label">Кто:</span>
          <div class="person-slider" id="topPersonSlider" data-person="А">
            <div class="person-slider-thumb" id="topPersonThumb"></div>
            <button type="button" class="person-slider-opt active" data-val="А">А</button>
            <button type="button" class="person-slider-opt" data-val="+1">+1</button>
          </div>
        </div>
      </div>
    </header>

    <div id="activeOrderBanner" class="bank-banner hidden"></div>

    <main id="mainView" class="main-scroll"></main>

    <nav class="tabbar" aria-label="Навигация">
      <button class="tab-item active" data-tab="swipe" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
        <span>Отбор</span>
        <span id="inboxBadge" class="tab-badge gold hidden">0</span>
      </button>
      <button class="tab-item" data-tab="week" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        <span>Расписание</span>
      </button>
      <button class="tab-item" data-tab="liked" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20.5s-7-4.35-9.2-8.4C1.1 8.9 3.1 5 6.9 5c2.1 0 3.7 1.1 5.1 2.8C13.4 6.1 15 5 17.1 5c3.8 0 5.8 3.9 4.1 7.1-2.2 4.05-9.2 8.4-9.2 8.4z"/></svg>
        <span>Нравятся</span>
        <span id="likedBadge" class="tab-badge gold hidden">0</span>
      </button>
      <button class="tab-item" data-tab="tickets" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/><path d="M10 6v12" stroke-dasharray="2.5 2.5"/></svg>
        <span>Билеты</span>
        <span id="ticketsBadge" class="tab-badge hidden">0</span>
      </button>
      <button class="tab-item" data-tab="profile" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3.5"/><path d="M3 19c0-3.1 2.7-5.5 6-5.5s6 2.4 6 5.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 14.2c2.6.3 4.8 2.1 5 4.8"/></svg>
        <span>Люди</span>
      </button>
    </nav>

    <div id="sheetBackdrop" class="sheet-backdrop hidden">
      <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/static/app.js?v=61"></script>
</body>
</html>
